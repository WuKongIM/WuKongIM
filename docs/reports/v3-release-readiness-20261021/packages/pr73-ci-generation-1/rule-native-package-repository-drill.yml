name: Safety Automation - Drill Native Package Repository

on:
  pull_request:
    paths:
      - ".github/workflows/native-package-repository-drill.yml"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-package-repository-drill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    name: TEST ONLY signed APT/RPM repository
    if: github.repository == 'WuKongIM/packages'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact package-repository control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate reviewed control
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./tests/contract.sh
          commit="$(jq -r '.commit' manifests/trusted-toolchain.json)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out immutable trusted repository tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: WuKongIM/WuKongIM
          ref: ${{ steps.toolchain.outputs.commit }}
          path: .trusted/wukongim
          persist-credentials: false

      - name: Verify trusted repository tool bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .trusted/wukongim rev-parse HEAD)" = "${{ steps.toolchain.outputs.commit }}"
          jq -r \
            '.files | to_entries[] | "\(.value)  .trusted/wukongim/\(.key)"' \
            manifests/trusted-toolchain.json | sha256sum --check --strict

      - name: Check real native source metadata in isolated TEST ONLY fixtures
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.enabled == true' manifests/signing-toolchain.json >/dev/null
          image="$(jq -r '.image + "@" + .digest' manifests/signing-toolchain.json)"
          docker pull "$image"
          metadata_output="$RUNNER_TEMP/source-metadata-native"
          mkdir "$metadata_output"
          chmod 0777 "$metadata_output"
          container="wk-source-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          timeout --signal=TERM --kill-after=10s 5m docker run --rm --name "$container" \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65532:65532 --cpus 1 --memory 512m --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --volume "$GITHUB_WORKSPACE:/control:ro" \
            --volume "$metadata_output:/evidence" \
            --workdir /tmp "$image" \
            python3 -B /control/tests/native_source_metadata_drill.py --output-dir /evidence
          jq -e '.test_only == true and .passed == true and (.cases | length) == 7 and all(.cases[]; .passed == true)' \
            "$metadata_output/native-source-metadata.json" >/dev/null

      - name: Preserve TEST ONLY native metadata evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-source-metadata-test-only
          path: ${{ runner.temp }}/source-metadata-native/
          if-no-files-found: warn
          retention-days: 30

      - name: Sign and independently verify real TEST ONLY local file inputs
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.enabled == true' manifests/signing-toolchain.json >/dev/null
          image="$(jq -r '.image + "@" + .digest' manifests/signing-toolchain.json)"
          signing_output="$RUNNER_TEMP/local-signing-native"
          mkdir "$signing_output"
          chmod 0777 "$signing_output"
          container="wk-local-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          timeout --signal=TERM --kill-after=10s 8m docker run --rm --name "$container" \
            --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --cpus 1 --memory 512m --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --volume "$GITHUB_WORKSPACE:/control:ro" \
            --volume "$signing_output:/evidence" \
            --workdir /tmp "$image" \
            python3 -B /control/tests/native_local_signing_drill.py --output-dir /evidence
          jq -e '.test_only == true and .passed == true and .secret_tree_removed_before_verification == true and (.cases | length) == 10 and all(.cases[]; .passed == true)' \
            "$signing_output/native-local-signing.json" >/dev/null

      - name: Preserve TEST ONLY native local signing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-local-signing-test-only
          path: ${{ runner.temp }}/local-signing-native/native-local-signing.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build and coinstall TEST ONLY preview and stable bootstrap preparations
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.enabled == true' manifests/signing-toolchain.json >/dev/null
          image="$(jq -r '.image + "@" + .digest' manifests/signing-toolchain.json)"
          bootstrap_output="$RUNNER_TEMP/bootstrap-preparation-native"
          mkdir "$bootstrap_output"
          chmod 0777 "$bootstrap_output"
          container="wk-bootstrap-preparation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # Root and SYS_CHROOT are limited to scratch native package databases.
          # This data-only installation drill has no signing input or network.
          timeout --signal=TERM --kill-after=10s 5m docker run --rm --name "$container" \
            --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --cap-add SYS_CHROOT --security-opt no-new-privileges --user 0:0 \
            --cpus 1 --memory 512m --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --volume "$GITHUB_WORKSPACE:/control:ro" \
            --volume "$bootstrap_output:/evidence" \
            --workdir /tmp "$image" \
            python3 -B /control/tests/native_bootstrap_preparation_drill.py \
            --output-dir /evidence --source-sha "$GITHUB_SHA"
          jq -e '.test_only == true and .passed == true and .scratch_removed == true and (.cases | length) == 6 and all(.cases[]; .passed == true)' \
            "$bootstrap_output/native-bootstrap-preparation.json" >/dev/null

      - name: Preserve TEST ONLY native bootstrap preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-bootstrap-preparation-test-only
          path: ${{ runner.temp }}/bootstrap-preparation-native/native-bootstrap-preparation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Compose and independently verify TEST ONLY stable offline candidate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.enabled == true' manifests/signing-toolchain.json >/dev/null
          image="$(jq -r '.image + "@" + .digest' manifests/signing-toolchain.json)"
          candidate_output="$RUNNER_TEMP/stable-candidate-native"
          mkdir "$candidate_output"
          chmod 0777 "$candidate_output"
          container="wk-stable-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          timeout --signal=TERM --kill-after=10s 10m docker run --rm --name "$container" \
            --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --cpus 1 --memory 512m --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --volume "$GITHUB_WORKSPACE:/control:ro" \
            --volume "$candidate_output:/evidence" \
            --workdir /tmp "$image" \
            python3 -B /control/tests/native_stable_candidate_drill.py \
            --output-dir /evidence --source-sha "$GITHUB_SHA" \
            --trusted-root /control/.trusted/wukongim
          jq -e '.test_only == true and .passed == true and .secret_tree_removed_before_verification == true and .scratch_removed == true and .checked_in_control_unchanged == true and (.cases | length) == 31 and all(.cases[]; .passed == true)' \
            "$candidate_output/native-stable-candidate.json" >/dev/null

      - name: Preserve TEST ONLY native stable candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-stable-candidate-test-only
          path: ${{ runner.temp }}/stable-candidate-native/native-stable-candidate.json
          if-no-files-found: warn
          retention-days: 30

      - name: Set up fixed GoReleaser toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: .trusted/wukongim/go.sum
          cache: true

      - name: Install fixed GoReleaser version
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/goreleaser-bin"
          mkdir -p "$install_dir"
          GOBIN="$install_dir" go install github.com/goreleaser/goreleaser/v2@v2.18.0
          echo "install_dir=$install_dir" >> "$GITHUB_ENV"

      - name: Restore exact source Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .trusted/wukongim/go.mod
          cache-dependency-path: .trusted/wukongim/go.sum
          cache: true

      - name: Build unsigned TEST ONLY packages
        shell: bash
        run: |
          set -euo pipefail
          cd .trusted/wukongim
          "$install_dir/goreleaser" release --snapshot --clean --config .goreleaser.packages.yaml

      - name: Build, sign, verify, and install TEST ONLY repositories
        env:
          WK_NATIVE_PACKAGE_DIST_DIR: ${{ github.workspace }}/.trusted/wukongim/dist
        run: .trusted/wukongim/scripts/validate-native-package-repositories-container.sh

      - name: Reject tracked-tree mutation
        if: always()
        shell: bash
        run: git diff --exit-code HEAD -- . ':!.trusted'

name: Safety Automation - Manager Browser Smoke
run-name: >-
  Manager Browser Smoke ${{ github.event_name }}
  ${{ github.event.pull_request.number || github.ref_name }} attempt ${{ github.run_attempt }}

on:
  pull_request:
    paths:
      - ".github/workflows/manager-browser-smoke.yml"
      - "cmd/wukongim/**"
      - "go.mod"
      - "go.sum"
      - "internal/access/manager/**"
      - "internal/app/**"
      - "internal/config/**"
      - "internal/runtime/online/**"
      - "internal/usecase/management/**"
      - "pkg/cluster/**"
      - "scripts/github_workflows_test.go"
      - "scripts/manager_browser_smoke_workflow_test.go"
      - "test/e2e/AGENTS.md"
      - "test/e2e/cluster/**"
      - "test/e2e/suite/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromium-smoke:
    name: Real three-node Manager Chromium smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.12.0"
      - name: Install Chromium and build the production Manager bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.11"
          cd web
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run build
      - name: Run the real three-node browser matrix
        shell: bash
        run: |
          set -euo pipefail
          WK_E2E_MANAGER_BROWSER=1 GOWORK=off go test -tags=e2e ./test/e2e/cluster/manager_browser_smoke -count=1 -timeout 5m -p=1 -v
      - name: Reject tracked-tree mutation
        if: always()
        shell: bash
        run: git diff --exit-code HEAD --
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-browser-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 7

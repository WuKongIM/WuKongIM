name: Safety Automation - GitHub Issue Agent

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["Safety Automation - Issue Agent PR Signal"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: Exact Issue number to reconcile
        required: false
        type: number

permissions: {}

jobs:
  controller:
    name: Reconcile fresh GitHub facts
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'agent/issue-') &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: issue-agent-publisher
    concurrency:
      group: issue-agent-state-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      dispatch: ${{ steps.reconcile.outputs.dispatch }}
      repository: ${{ steps.reconcile.outputs.repository }}
      issue_number: ${{ steps.reconcile.outputs.issue_number }}
      task_id: ${{ steps.reconcile.outputs.task_id }}
      base_sha: ${{ steps.reconcile.outputs.base_sha }}
      control_sha: ${{ steps.reconcile.outputs.control_sha }}
      state_head_sha: ${{ steps.reconcile.outputs.state_head_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - name: Build the protected controller
        shell: bash
        run: GOWORK=off go build -trimpath -o "$RUNNER_TEMP/wkissueagent" ./cmd/wkissueagent
      - name: Reconcile one Issue or one bounded sweep
        id: reconcile
        shell: bash
        env:
          ISSUE_AGENT_APP_ID: ${{ vars.ISSUE_AGENT_APP_ID }}
          ISSUE_AGENT_APP_INSTALLATION_ID: ${{ vars.ISSUE_AGENT_APP_INSTALLATION_ID }}
          ISSUE_AGENT_REPOSITORY_ID: ${{ github.repository_id }}
          ISSUE_AGENT_APP_LOGIN: ${{ vars.ISSUE_AGENT_APP_LOGIN }}
          REVIEW_AGENT_APP_LOGIN: ${{ vars.REVIEW_AGENT_APP_LOGIN }}
          ISSUE_AGENT_APP_PRIVATE_KEY: ${{ secrets.ISSUE_AGENT_APP_PRIVATE_KEY }}
          ISSUE_NUMBER_INPUT: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg event_path "$GITHUB_EVENT_PATH" \
            --arg issue_number "$ISSUE_NUMBER_INPUT" \
            --arg control_sha "$(git rev-parse HEAD)" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repository:$repository,event_name:$event_name,event_path:$event_path,
              issue_number:($issue_number | if . == "" then 0 else tonumber end),
              control_sha:$control_sha,now:$now}' >"$RUNNER_TEMP/reconcile.json"
          "$RUNNER_TEMP/wkissueagent" reconcile-github \
            --input "$RUNNER_TEMP/reconcile.json" >"$RUNNER_TEMP/decision.json"
          jq -r '.warnings[]? | "::warning::Issue Agent \(.projection) projection: \(.reason)"' \
            "$RUNNER_TEMP/decision.json"
          jq -r '"dispatch=\(.dispatch)"' "$RUNNER_TEMP/decision.json" >>"$GITHUB_OUTPUT"
          jq -r '"repository=\(.repository)"' "$RUNNER_TEMP/decision.json" >>"$GITHUB_OUTPUT"
          jq -r '"issue_number=\(.issue_number)"' "$RUNNER_TEMP/decision.json" >>"$GITHUB_OUTPUT"
          jq -r '"task_id=\(.task_id)"' "$RUNNER_TEMP/decision.json" >>"$GITHUB_OUTPUT"
          jq -r '"base_sha=\(.base_sha)"' "$RUNNER_TEMP/decision.json" >>"$GITHUB_OUTPUT"
          jq -r '"control_sha=\(.control_sha)"' "$RUNNER_TEMP/decision.json" >>"$GITHUB_OUTPUT"
          jq -r '"state_head_sha=\(.state_head_sha)"' "$RUNNER_TEMP/decision.json" >>"$GITHUB_OUTPUT"

  engineer:
    name: Run one exact Issue task
    needs: controller
    if: needs.controller.outputs.dispatch == 'true'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/issue-agent-engineer.yml
    with:
      repository: ${{ needs.controller.outputs.repository }}
      issue_number: ${{ fromJSON(needs.controller.outputs.issue_number) }}
      task_id: ${{ needs.controller.outputs.task_id }}
      base_sha: ${{ needs.controller.outputs.base_sha }}
      control_sha: ${{ needs.controller.outputs.control_sha }}
      state_head_sha: ${{ needs.controller.outputs.state_head_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  publisher:
    name: Publish exact Draft PR
    needs: [controller, engineer]
    if: always() && needs.controller.result == 'success' && needs.controller.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: issue-agent-publisher
    permissions:
      contents: read
    concurrency:
      group: issue-agent-state-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.controller.outputs.control_sha }}
          persist-credentials: false
      - name: Download Context Bundle
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: issue-agent-context-${{ needs.controller.outputs.issue_number }}
          path: ${{ runner.temp }}/issue-agent-context
      - name: Download candidate and advisory result
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: issue-agent-candidate-${{ needs.controller.outputs.issue_number }}
          path: ${{ runner.temp }}/issue-agent-candidate
      - name: Download trusted evidence
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: issue-agent-evidence-${{ needs.controller.outputs.issue_number }}
          path: ${{ runner.temp }}/issue-agent-evidence
      - name: Build protected Publisher
        shell: bash
        run: GOWORK=off go build -trimpath -o "$RUNNER_TEMP/wkissueagent" ./cmd/wkissueagent
      - name: Mint short-lived repository-scoped App token
        shell: bash
        env:
          ISSUE_AGENT_APP_ID: ${{ vars.ISSUE_AGENT_APP_ID }}
          ISSUE_AGENT_APP_INSTALLATION_ID: ${{ vars.ISSUE_AGENT_APP_INSTALLATION_ID }}
          ISSUE_AGENT_REPOSITORY_ID: ${{ github.repository_id }}
          ISSUE_AGENT_APP_PRIVATE_KEY: ${{ secrets.ISSUE_AGENT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          jq -n --arg repository "${{ needs.controller.outputs.repository }}" \
            '{repository:$repository}' >"$RUNNER_TEMP/mint.json"
          "$RUNNER_TEMP/wkissueagent" mint-app-token \
            --input "$RUNNER_TEMP/mint.json" >"$RUNNER_TEMP/app-token.json"
          app_token="$(jq -er .token "$RUNNER_TEMP/app-token.json")"
          echo "::add-mask::$app_token"
          printf 'ISSUE_AGENT_GITHUB_TOKEN=%s\n' "$app_token" >>"$GITHUB_ENV"
      - name: Publish without executing candidate code
        shell: bash
        env:
          ISSUE_AGENT_APP_LOGIN: ${{ vars.ISSUE_AGENT_APP_LOGIN }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "${{ needs.controller.outputs.repository }}" \
            --argjson issue_number "${{ needs.controller.outputs.issue_number }}" \
            --arg control_sha "${{ needs.controller.outputs.control_sha }}" \
            --arg expected_state_head "${{ needs.controller.outputs.state_head_sha }}" \
            --arg context "$RUNNER_TEMP/issue-agent-context/context-bundle.json" \
            --arg engineer "$RUNNER_TEMP/issue-agent-candidate/engineer-result.json" \
            --arg candidate "$RUNNER_TEMP/issue-agent-candidate/candidate.json" \
            --arg evidence "$RUNNER_TEMP/issue-agent-evidence/candidate-evidence.json" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repository:$repository,issue_number:$issue_number,control_sha:$control_sha,
              expected_state_head:$expected_state_head,context_path:$context,
              engineer_result_path:$engineer,candidate_path:$candidate,
              evidence_path:$evidence,now:$now}' >"$RUNNER_TEMP/publish.json"
          "$RUNNER_TEMP/wkissueagent" publish-candidate \
            --input "$RUNNER_TEMP/publish.json"

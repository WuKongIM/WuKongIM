name: Agent Tool - Start Chat Lifecycle Repair
run-name: Chat Lifecycle Repair ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Initial protected-main source commit
        required: true
        type: string
      operator:
        description: Fixed operator identity
        required: true
        type: string
      codex_diagnostic_pubkey:
        description: Per-request Codex diagnostic Ed25519 public key
        required: true
        type: string
      request_id:
        description: Exact repair request identity
        required: true
        type: string
      paid_authorization:
        description: Exact authorization for one reusable paid repair Lease
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: chat-lifecycle-paid-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    name: Reuse one Lease until the bounded short run qualifies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: cloud-deployment
    env:
      GH_TOKEN: ${{ github.token }}
      WK_CHAT_SOURCE_SHA: ${{ inputs.source_sha }}
      WK_CHAT_OPERATOR: ${{ inputs.operator }}
      WK_CHAT_CODEX_DIAGNOSTIC_PUBKEY: ${{ inputs.codex_diagnostic_pubkey }}
      WK_CHAT_REQUEST_ID: ${{ inputs.request_id }}
      WK_CHAT_STAGE: repair
      WK_CHAT_WRAPPING_PUBLIC_KEY: ${{ vars.WK_CHAT_LIFECYCLE_WRAPPING_PUBLIC_KEY }}
      WK_CHAT_TEMPLATE: configs/cloud/chat-lifecycle/repair-v1.json
      WK_CHAT_OUTPUT_DIR: /tmp/wukongim-chat-lifecycle/${{ github.run_id }}/repair
      WK_CHAT_WORK_DIR: /tmp/wukongim-chat-lifecycle/${{ github.run_id }}/work
      WK_CHAT_CLEANUP_DIR: /tmp/wukongim-chat-lifecycle/${{ github.run_id }}/fallback-cleanup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Validate exact paid repair boundary
        shell: bash
        env:
          PAID_AUTHORIZATION: ${{ inputs.paid_authorization }}
        run: |
          set -euo pipefail
          [[ "$WK_CHAT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WK_CHAT_OPERATOR" == tangtaoit ]]
          [[ "$WK_CHAT_REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]]
          [[ "$PAID_AUTHORIZATION" == create-paid-cloud-lease ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$WK_CHAT_SOURCE_SHA" origin/main
          umask 077
          printf '%s\n' "$WK_CHAT_CODEX_DIAGNOSTIC_PUBKEY" >"$RUNNER_TEMP/codex-diagnostic.pub"
          ssh-keygen -lf "$RUNNER_TEMP/codex-diagnostic.pub" | grep -q ED25519
          printf '%s\n' "$WK_CHAT_WRAPPING_PUBLIC_KEY" >"$RUNNER_TEMP/wrapping.pub"
          ssh-keygen -lf "$RUNNER_TEMP/wrapping.pub" | grep -q ED25519
      - name: Build trusted repair controller
        shell: bash
        run: go build -trimpath -o "$RUNNER_TEMP/wkchatlifecycle" ./cmd/wkchatlifecycle
      - name: Refuse repair while an official Lease lacks zero proof
        shell: bash
        run: |
          set -euo pipefail
          for stage in rehearsal formal; do
            WK_CHAT_STAGE="$stage" scripts/chat-lifecycle/discover-active-handoffs.sh '' "$RUNNER_TEMP/active-${stage}.json"
            jq -e '.include | length == 0' "$RUNNER_TEMP/active-${stage}.json" >/dev/null
          done
          scripts/chat-lifecycle/discover-active-repair-handoffs.sh '' "$RUNNER_TEMP/active-repair.json"
          jq -e '.include | length == 0' "$RUNNER_TEMP/active-repair.json" >/dev/null
      - name: Repair on one Lease until qualified or bounded stop
        shell: bash
        env:
          WK_CHAT_TOOL: ${{ runner.temp }}/wkchatlifecycle
        run: scripts/chat-lifecycle/stage-orchestrate.sh
      - name: Detect bounded repair result
        id: result
        if: always()
        shell: bash
        run: |
          if [[ -f "$WK_CHAT_OUTPUT_DIR/repair-qualified.json" || -f "$WK_CHAT_OUTPUT_DIR/deployment-repair-pending.json" || -f "$WK_CHAT_OUTPUT_DIR/cleanup.json" || -f "$WK_CHAT_OUTPUT_DIR/cleanup-pending.json" ]]; then
            echo 'publish=true' >>"$GITHUB_OUTPUT"
          else
            echo 'publish=false' >>"$GITHUB_OUTPUT"
          fi
          if [[ -f "$WK_CHAT_OUTPUT_DIR/cleanup.json" && -f "$WK_CHAT_OUTPUT_DIR/zero-inventory.json" ]]; then
            echo 'cleanup=true' >>"$GITHUB_OUTPUT"
          else
            echo 'cleanup=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Upload bounded repair result
        if: always() && steps.result.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-lifecycle-repair-result-${{ inputs.request_id }}
          path: ${{ env.WK_CHAT_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload repair zero-inventory proof
        if: always() && steps.result.outputs.cleanup == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-lifecycle-repair-cleanup-${{ inputs.request_id }}
          path: ${{ env.WK_CHAT_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
      - name: Remove plaintext runner identities
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/wrapping.pub" "$RUNNER_TEMP/codex-diagnostic.pub"

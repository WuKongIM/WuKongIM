name: Safety Automation - Agent PR Merge Gate
run-name: "Agent PR #${{ github.event.pull_request.number }} merge gate ${{ github.event.action }} head ${{ github.event.pull_request.head.sha }} merge ${{ github.sha }}"

on:
  pull_request:
    types: [edited, opened, reopened, synchronize]

permissions: {}

concurrency:
  group: agent-pr-merge-gate-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Agent Validation Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Verify PR-bound Agent validation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          GATE_RUN_ID: ${{ github.run_id }}
          EVENT_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$EVENT_UPDATED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]{0,2}$ ]]
          if [[ "$RUN_ATTEMPT" -eq 1 ]]; then
            base_tree_sha="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/git/commits/${BASE_SHA}" \
                --jq .tree.sha
            )"
            [[ "$base_tree_sha" =~ ^[0-9a-f]{40}$ ]]
            gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/git/trees/${base_tree_sha}" \
              -f recursive=1 >base-tree.json
            jq -e '
              .truncated == false and
              (.tree | type == "array") and
              all(.tree[];
                type == "object" and
                (.path | type == "string" and length > 0))
            ' >/dev/null base-tree.json
            base_has_gate="$(
              jq -r \
                'any(.tree[]; .path == ".github/workflows/agent-pr-merge-gate.yml")' \
                base-tree.json
            )"
            if [[ "$base_has_gate" == false ]]; then
              echo "::notice::Bootstrap PR: the merge-gate workflow is not yet on the base branch"
              exit 0
            fi
            test "$base_has_gate" = true
            echo "::error::A new Agent validation request is required for this PR event"
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" >current-pr.json
          current_head="$(jq -er '.head.sha' current-pr.json)"
          current_merge="$(jq -er '.merge_commit_sha' current-pr.json)"
          test "$current_head" = "$HEAD_SHA"
          test "$current_merge" = "$MERGE_SHA"

          verify_latest_gate_generation() {
            gh api --paginate --slurp -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/agent-pr-merge-gate.yml/runs" \
              -f event=pull_request \
              -f per_page=100 >merge-gate-run-pages.json
            latest_gate_run_id="$(
              jq -er \
                --arg head_sha "$HEAD_SHA" \
                --arg prefix "Agent PR #${PR_NUMBER} merge gate " \
                --arg suffix " head ${HEAD_SHA} merge ${MERGE_SHA}" '
                  [
                    .[].workflow_runs[]
                    | select(.event == "pull_request")
                    | select(.head_sha == $head_sha)
                    | select(.path == ".github/workflows/agent-pr-merge-gate.yml")
                    | select(
                        .display_title == ($prefix + "edited" + $suffix) or
                        .display_title == ($prefix + "opened" + $suffix) or
                        .display_title == ($prefix + "reopened" + $suffix) or
                        .display_title == ($prefix + "synchronize" + $suffix))
                  ]
                  | max_by(.id)
                  | .id
                ' merge-gate-run-pages.json
            )"
            test "$latest_gate_run_id" = "$GATE_RUN_ID"
          }
          verify_latest_gate_generation

          request_context="Agent Validation Request / PR #${PR_NUMBER} / Gate #${GATE_RUN_ID}"
          evidence_context="Agent Validation Evidence / PR #${PR_NUMBER} / Gate #${GATE_RUN_ID}"
          gh api --paginate --slurp -X GET \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/statuses" \
            -f per_page=100 >status-pages.json
          jq '[.[][]]' status-pages.json >statuses.json

          request_status="$(
            jq -cer \
              --arg context "$request_context" \
              --arg event_updated_at "$EVENT_UPDATED_AT" '
                first(
                  .[]
                  | select(.context == $context)
                  | select(.created_at >= $event_updated_at)
                )
              ' statuses.json
          )"
          request_run_id="$(
            jq -er '
              .target_url
              | select(type == "string")
              | capture("/actions/runs/(?<run_id>[1-9][0-9]*)$").run_id
            ' <<<"$request_status"
          )"
          [[ "$request_run_id" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${request_run_id}" \
            >request-run.json
          jq -e \
            --arg title \
              "Agent PR #${PR_NUMBER} validation labeled head ${HEAD_SHA}" '
              .path == ".github/workflows/agent-pr-validation-control.yml" and
              .event == "pull_request_target" and
              .display_title == $title and
              .status == "completed" and
              .conclusion == "success"
            ' >/dev/null request-run.json

          evidence_status="$(
            jq -cer --arg context "$evidence_context" '
              first(.[] | select(.context == $context))
            ' statuses.json
          )"
          evidence_run_id="$(
            jq -er '
              .target_url
              | select(type == "string")
              | capture("/actions/runs/(?<run_id>[1-9][0-9]*)$").run_id
            ' <<<"$evidence_status"
          )"
          [[ "$evidence_run_id" =~ ^[1-9][0-9]{0,19}$ ]]
          evidence_complete=false
          for attempt in {1..12}; do
            if gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${evidence_run_id}" \
              >evidence-run.json &&
              jq -e '.status == "completed"' >/dev/null evidence-run.json; then
              evidence_complete=true
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          test "$evidence_complete" = true
          jq -e \
            --arg title \
              "Agent PR #${PR_NUMBER} validation head ${HEAD_SHA} merge ${MERGE_SHA} gate ${GATE_RUN_ID} request ${request_run_id}" '
              .path == ".github/workflows/agent-pr-validation.yml" and
              .event == "repository_dispatch" and
              .display_title == $title and
              .status == "completed" and
              .conclusion == "success"
            ' >/dev/null evidence-run.json
          jq -e '.state == "success"' >/dev/null <<<"$request_status"
          jq -e '.state == "success"' >/dev/null <<<"$evidence_status"
          verify_latest_gate_generation

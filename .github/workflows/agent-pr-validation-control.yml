name: Safety Automation - Agent PR Validation Control
run-name: "Agent PR #${{ github.event.pull_request.number }} validation ${{ github.event.action }} head ${{ github.event.pull_request.head.sha }}"

on:
  pull_request_target:
    types: [edited, labeled, opened, reopened, synchronize]

permissions: {}

jobs:
  request:
    name: Dispatch trusted Agent validation
    if: github.event.action == 'labeled' && github.event.label.name == 'agent-ci/run'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Authorize and dispatch the commit-bound request
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_ACTOR: ${{ github.actor }}
          ISSUE_AGENT_APP_LOGIN: ${{ vars.ISSUE_AGENT_APP_LOGIN }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$TRIGGER_ACTOR" = "$ISSUE_AGENT_APP_LOGIN" ]]; then
            [[ "$TRIGGER_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}\[bot\]$ ]]
          else
            [[ "$TRIGGER_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" >current-pr.json
          current_head="$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' current-pr.json)"
          merge_sha="$(
            jq -er \
              '.merge_commit_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              current-pr.json
          )"
          test "$current_head" = "$HEAD_SHA"
          gh api --paginate --slurp -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/agent-pr-merge-gate.yml/runs" \
            -f event=pull_request \
            -f per_page=100 >merge-gate-run-pages.json
          gate_run_id="$(
            jq -er \
              --arg head_sha "$HEAD_SHA" \
              --arg prefix "Agent PR #${PR_NUMBER} merge gate " \
              --arg suffix " head ${HEAD_SHA} merge ${merge_sha}" '
                [
                  .[].workflow_runs[]
                  | select(.event == "pull_request")
                  | select(.head_sha == $head_sha)
                  | select(.path == ".github/workflows/agent-pr-merge-gate.yml")
                  | select(
                      .display_title == ($prefix + "edited" + $suffix) or
                      .display_title == ($prefix + "opened" + $suffix) or
                      .display_title == ($prefix + "reopened" + $suffix) or
                      .display_title == ($prefix + "synchronize" + $suffix))
                ]
                | max_by(.id)
                | select(.status == "completed" and .conclusion == "failure")
                | .id
              ' merge-gate-run-pages.json
          )"
          [[ "$gate_run_id" =~ ^[1-9][0-9]{0,19}$ ]]
          if [[ "$TRIGGER_ACTOR" != "$ISSUE_AGENT_APP_LOGIN" ]]; then
            permission="$(
              gh api "repos/${GITHUB_REPOSITORY}/collaborators/${TRIGGER_ACTOR}/permission" \
                --jq .permission
            )"
            case "$permission" in
              admin|maintain|write) ;;
              *)
                echo "::error::${TRIGGER_ACTOR} is not authorized to request Agent validation"
                exit 1
                ;;
            esac
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f "context=Agent Validation Request / PR #${PR_NUMBER} / Gate #${gate_run_id}" \
            -f description="Authorized by ${TRIGGER_ACTOR}" \
            -f target_url="$REQUEST_RUN_URL" >/dev/null
          jq -n \
            --arg event_type agent-pr-validation \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg merge_sha "$merge_sha" \
            --arg gate_run_id "$gate_run_id" \
            --arg trigger_actor "$TRIGGER_ACTOR" \
            --arg request_run_id "$REQUEST_RUN_ID" \
            '{
              event_type: $event_type,
              client_payload: {
                pr_number: $pr_number,
                head_sha: $head_sha,
                merge_sha: $merge_sha,
                gate_run_id: $gate_run_id,
                trigger_actor: $trigger_actor,
                request_run_id: $request_run_id
              }
            }' >dispatch.json
          gh api -X POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input dispatch.json >/dev/null
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/agent-ci%2Frun" \
            >/dev/null
          printf 'merge_sha=%s\n' "$merge_sha" >>"$GITHUB_OUTPUT"
          printf 'gate_run_id=%s\n' "$gate_run_id" >>"$GITHUB_OUTPUT"
      - name: Write dispatch summary
        shell: bash
        run: |
          {
            echo '## Agent validation request'
            echo
            echo "- PR: \`#${{ github.event.pull_request.number }}\`"
            echo "- Head SHA: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- Test-merge SHA: \`${{ steps.dispatch.outputs.merge_sha }}\`"
            echo "- Validation generation: gate run \`${{ steps.dispatch.outputs.gate_run_id }}\`"
            echo "- Trigger actor: \`${{ github.actor }}\`"
            echo "- Result: trusted validation dispatched"
          } >>"$GITHUB_STEP_SUMMARY"

  invalidate:
    name: Invalidate previous Agent validation
    if: github.event.action == 'edited' || github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      group: agent-pr-validation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Write invalidation summary
        shell: bash
        run: |
          {
            echo '## Agent validation invalidated'
            echo
            echo "- PR: \`#${{ github.event.pull_request.number }}\`"
            echo "- New head SHA: \`${{ github.event.pull_request.head.sha }}\`"
            echo '- A fresh Agent validation plan is required.'
          } >>"$GITHUB_STEP_SUMMARY"

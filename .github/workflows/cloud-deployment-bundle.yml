name: Agent Tool - Build Cloud Deployment Bundle
run-name: Cloud Deployment Bundle ${{ inputs.source_sha }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable product source commit reachable from trusted main
        required: true
        type: string
      request_id:
        description: Exact caller correlation identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-deployment-bundle-${{ github.repository }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and seal offline four-host payload
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOWORK: "off"
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Checkout trusted control revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout immutable product source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: control/go.mod
          cache: true
          cache-dependency-path: |
            control/go.sum
            source/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.12.0"
      - name: Prove source and control identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]]
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "$REQUESTED_SOURCE_SHA"
          git -C source fetch --no-tags origin main
          git -C source merge-base --is-ancestor "$REQUESTED_SOURCE_SHA" origin/main
          echo "source_sha=$REQUESTED_SOURCE_SHA" >>"$GITHUB_OUTPUT"
          echo "control_sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
      - name: Build Manager and Demo assets on the runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.3.11
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = 1.22.22
          (cd source/web && bun install --frozen-lockfile && bun run build)
          (cd source/demo/chatdemo && yarn install --frozen-lockfile && yarn run build)
          test -s source/internal/access/manager/webui/dist/index.html
          test -s source/internal/access/api/demoui/dist/index.html
      - name: Build Linux AMD64 product and control binaries
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/cloud-deployment-bundle"
          install -d -m 0755 "$bundle/bin" "$bundle/assets/manager" "$bundle/assets/demo" "$bundle/config"
          for target in wukongim:./cmd/wukongim wkbench:./cmd/wkbench wkanalysis:./cmd/wkanalysis; do
            name="${target%%:*}"
            package="${target#*:}"
            (cd source && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w -buildid=' -o "$bundle/bin/$name" "$package")
          done
          for target in wkchatlifecycle:./cmd/wkchatlifecycle wkcloudbundle:./cmd/wkcloudbundle wkcloudgate:./cmd/wkcloudgate wkcloudhost:./cmd/wkcloudhost; do
            name="${target%%:*}"
            package="${target#*:}"
            (cd control && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w -buildid=' -o "$bundle/bin/$name" "$package")
          done
          cp -a source/internal/access/manager/webui/dist/. "$bundle/assets/manager/"
          cp -a source/internal/access/api/demoui/dist/. "$bundle/assets/demo/"
          install -m 0644 source/configs/wkbench/chat-lifecycle/formal.yaml "$bundle/config/chat-lifecycle.yaml"
          install -m 0644 source/configs/wkbench/chat-lifecycle/rehearsal.yaml "$bundle/config/chat-lifecycle-rehearsal.yaml"
      - name: Add checksum-pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          source control/.github/cloud-deployment/toolchain.env
          downloads="$RUNNER_TEMP/cloud-deployment-downloads"
          bundle="$RUNNER_TEMP/cloud-deployment-bundle"
          install -d -m 0755 "$downloads/prometheus" "$downloads/exporter" "$downloads/caddy"
          prometheus_archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          exporter_archive="node_exporter-${NODE_EXPORTER_VERSION}.linux-amd64.tar.gz"
          caddy_archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 -o "$downloads/$prometheus_archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${prometheus_archive}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 -o "$downloads/$exporter_archive" \
            "https://github.com/prometheus/node_exporter/releases/download/v${NODE_EXPORTER_VERSION}/${exporter_archive}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 -o "$downloads/$caddy_archive" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/${caddy_archive}"
          echo "$PROMETHEUS_LINUX_AMD64_SHA256  $downloads/$prometheus_archive" | sha256sum --check --strict
          echo "$NODE_EXPORTER_LINUX_AMD64_SHA256  $downloads/$exporter_archive" | sha256sum --check --strict
          echo "$CADDY_LINUX_AMD64_SHA256  $downloads/$caddy_archive" | sha256sum --check --strict
          tar -xzf "$downloads/$prometheus_archive" -C "$downloads/prometheus" --strip-components=1
          tar -xzf "$downloads/$exporter_archive" -C "$downloads/exporter" --strip-components=1
          tar -xzf "$downloads/$caddy_archive" -C "$downloads/caddy"
          install -m 0755 "$downloads/prometheus/prometheus" "$bundle/bin/prometheus"
          install -m 0755 "$downloads/exporter/node_exporter" "$bundle/bin/node_exporter"
          install -m 0755 "$downloads/caddy/caddy" "$bundle/bin/caddy"
      - name: Seal and independently verify content address
        id: bundle
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          CONTROL_SHA: ${{ steps.identity.outputs.control_sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/cloud-deployment-bundle"
          "$bundle/bin/wkcloudbundle" seal-offline --root "$bundle" --source-sha "$SOURCE_SHA" --control-sha "$CONTROL_SHA" >bundle-manifest-output.json
          bundle_digest="$(jq -er .bundle_digest bundle-manifest-output.json)"
          test "$bundle_digest" = "$("$bundle/bin/wkcloudbundle" verify-offline --root "$bundle" | jq -er .bundle_digest)"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf cloud-deployment-bundle.tar.gz -C "$bundle" .
          sha256sum cloud-deployment-bundle.tar.gz >cloud-deployment-bundle.tar.gz.sha256
          echo "bundle_digest=$bundle_digest" >>"$GITHUB_OUTPUT"
          echo "digest_hex=${bundle_digest#sha256:}" >>"$GITHUB_OUTPUT"
      - name: Upload content-addressed offline bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-deployment-bundle-${{ steps.bundle.outputs.digest_hex }}
          path: |
            cloud-deployment-bundle.tar.gz
            cloud-deployment-bundle.tar.gz.sha256
            bundle-manifest-output.json
          if-no-files-found: error
          retention-days: 7

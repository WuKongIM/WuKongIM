name: Agent Tool - Provision Cloud Lease
run-name: Cloud Lease Provision ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Exact request correlation identifier
        required: true
        type: string
      plan_json:
        description: Strict wukongim.cloud_lease.plan/v1 JSON
        required: true
        type: string
      bootstrap_access_json:
        description: Strict public bootstrap-access JSON with deployment and Codex Ed25519 keys
        required: true
        type: string
      admitted_quote_json:
        description: Exact admitted Quote consumed by paid Acquire; empty for Quote-only
        required: false
        default: ""
        type: string
      quote_only:
        description: Stop after the non-mutating Quote
        required: true
        default: true
        type: boolean
      paid_authorization:
        description: Exact create-paid-cloud-lease authorization; ignored for Quote-only
        required: false
        default: ""
        type: string
      repair_parent_run_id:
        description: Exact active repair owner; required only for a paid repair Acquire
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: cloud-lease-lifecycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  provision:
    name: Quote and optionally acquire one exact Lease
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cloud-lease-provision
    env:
      GOWORK: "off"
      REQUEST_ID: ${{ inputs.request_id }}
      PLAN_JSON: ${{ inputs.plan_json }}
      BOOTSTRAP_ACCESS_JSON: ${{ inputs.bootstrap_access_json }}
      ADMITTED_QUOTE_JSON: ${{ inputs.admitted_quote_json }}
      REPAIR_PARENT_RUN_ID: ${{ inputs.repair_parent_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Validate explicit request boundary
        shell: bash
        env:
          QUOTE_ONLY: ${{ inputs.quote_only }}
          PAID_AUTHORIZATION: ${{ inputs.paid_authorization }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          if [[ "$QUOTE_ONLY" != true && "$PAID_AUTHORIZATION" != create-paid-cloud-lease ]]; then
            echo 'Paid Acquire requires paid_authorization=create-paid-cloud-lease.' >&2
            exit 1
          fi
          if [[ "$QUOTE_ONLY" == true ]]; then
            [[ -z "$ADMITTED_QUOTE_JSON" ]] || {
              echo 'Quote-only must not receive an admitted Quote.' >&2
              exit 1
            }
          else
            [[ -n "$ADMITTED_QUOTE_JSON" ]] || {
              echo 'Paid Acquire requires the exact admitted Quote.' >&2
              exit 1
            }
          fi
          printf '%s\n' "$PLAN_JSON" >"$RUNNER_TEMP/plan.json"
          printf '%s\n' "$BOOTSTRAP_ACCESS_JSON" >"$RUNNER_TEMP/bootstrap-access.json"
          chmod 0600 "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/bootstrap-access.json"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg request_id "$REQUEST_ID" '
            .schema == "wukongim.cloud_lease/v1" and
            .repository == $repository and
            .request_id == $request_id
          ' "$RUNNER_TEMP/plan.json" >/dev/null || {
            echo 'Plan repository and request_id must match this workflow dispatch.' >&2
            exit 1
          }
          if [[ "$QUOTE_ONLY" != true ]]; then
            printf '%s\n' "$ADMITTED_QUOTE_JSON" >"$RUNNER_TEMP/quote.json"
            chmod 0600 "$RUNNER_TEMP/quote.json"
            jq -e --arg request_id "$REQUEST_ID" '
              .schema == "wukongim.cloud_lease.quote/v1" and
              .quote.request_id == $request_id and
              (.quote.plan_digest | test("^[0-9a-f]{64}$")) and
              .quote.capacity_available == true and .quote.quota_available == true
            ' "$RUNNER_TEMP/quote.json" >/dev/null || {
              echo 'Admitted Quote must be a matching usable Cloud Lease Quote.' >&2
              exit 1
            }
          fi
          plan_stage="$(jq -er '.tags.stage // ""' "$RUNNER_TEMP/plan.json")"
          if [[ "$QUOTE_ONLY" == false && "$plan_stage" == repair ]]; then
            [[ "$REPAIR_PARENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${REPAIR_PARENT_RUN_ID}" \
              >"$RUNNER_TEMP/repair-parent-run.json"
            jq -e --arg repository "$GITHUB_REPOSITORY" --arg request "$REQUEST_ID" '
              .repository.full_name == $repository and .head_repository.full_name == $repository and
              .head_branch == "main" and .event == "workflow_dispatch" and .status == "in_progress" and
              .display_title == ("Chat Lifecycle Repair " + $request) and
              (.path == ".github/workflows/chat-lifecycle-repair.yml" or
               .path == ".github/workflows/chat-lifecycle-repair.yml@refs/heads/main")
            ' "$RUNNER_TEMP/repair-parent-run.json" >/dev/null
            jq -n --arg schema 'wukongim.chat_lifecycle.repair_acquire_owner/v1' \
              --arg request_id "$REQUEST_ID" --argjson parent_run_id "$REPAIR_PARENT_RUN_ID" \
              '{schema:$schema,request_id:$request_id,parent_run_id:$parent_run_id}' \
              >"$RUNNER_TEMP/repair-owner.json"
            chmod 0600 "$RUNNER_TEMP/repair-owner.json"
          else
            [[ "$REPAIR_PARENT_RUN_ID" == 0 ]]
          fi
      - name: Build trusted Cloud Lease tool
        shell: bash
        run: go build -trimpath -o "$RUNNER_TEMP/wkcloudlease" ./cmd/wkcloudlease
      - name: Exchange exact Provisioner OIDC identity
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ vars.ALIBABA_CLOUD_LEASE_PROVISIONER_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_LEASE_OIDC_PROVIDER_ARN }}
          audience: ${{ vars.ALIBABA_CLOUD_LEASE_OIDC_AUDIENCE }}
          role-session-name: wukongim-cloud-lease-provision-${{ github.run_id }}
      - name: Quote exact capacity and budget
        if: inputs.quote_only == true
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wkcloudlease" quote --plan "$RUNNER_TEMP/plan.json" >"$RUNNER_TEMP/quote.json"
          chmod 0600 "$RUNNER_TEMP/quote.json"
      - name: Acquire explicitly authorized paid Lease
        if: inputs.quote_only == false
        shell: bash
        env:
          WK_ALIBABA_LIFECYCLE_MUTATION_AUTHORIZATION: create-and-delete-paid-cloud-lease
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wkcloudlease" acquire \
            --plan "$RUNNER_TEMP/plan.json" \
            --quote "$RUNNER_TEMP/quote.json" \
            --bootstrap-access "$RUNNER_TEMP/bootstrap-access.json" \
            >"$RUNNER_TEMP/receipt.json"
          chmod 0600 "$RUNNER_TEMP/receipt.json"
      - name: Upload non-secret Quote and Receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-lease-provision-${{ inputs.request_id }}
          path: |
            ${{ runner.temp }}/quote.json
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/repair-owner.json
          if-no-files-found: warn
          retention-days: 7

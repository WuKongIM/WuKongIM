name: Safety Automation - Review Agent PR Signal
run-name: >-
  Review Agent PR #${{ github.event.pull_request.number || github.event.issue.number }}
  signal ${{ github.event_name }}.${{ github.event.action }}
  object ${{ github.event.comment.id || github.event.review.id || 0 }}
  accepted ${{ github.event_name != 'issue_comment' ||
    (github.event.issue.pull_request != null &&
     (startsWith(github.event.comment.body, '@review-agent review') ||
      startsWith(github.event.comment.body, '@review-agent status') ||
      startsWith(github.event.comment.body, '@review-agent explain') ||
      startsWith(github.event.comment.body, '@review-agent reconsider') ||
      startsWith(github.event.comment.body, '@review-agent retry') ||
      startsWith(github.event.comment.body, '@review-agent cancel'))) }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: review-agent-signal-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  signal:
    name: Emit untrusted PR hint
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       (startsWith(github.event.comment.body, '@review-agent review') ||
        startsWith(github.event.comment.body, '@review-agent status') ||
        startsWith(github.event.comment.body, '@review-agent explain') ||
        startsWith(github.event.comment.body, '@review-agent reconsider') ||
        startsWith(github.event.comment.body, '@review-agent retry') ||
        startsWith(github.event.comment.body, '@review-agent cancel')))
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Validate bounded event hint
        shell: bash
        env:
          PR_HINT: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_KIND: ${{ github.event_name }}.${{ github.event.action }}
          OBJECT_HINT: ${{ github.event.comment.id || github.event.review.id || 0 }}
        run: |
          set -euo pipefail
          [[ "$PR_HINT" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$EVENT_KIND" =~ ^[a-z_]+\.[a-z_]+$ ]]
          [[ "$OBJECT_HINT" =~ ^[0-9]{1,20}$ ]]

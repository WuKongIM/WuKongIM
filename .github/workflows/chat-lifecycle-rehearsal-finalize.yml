name: Safety Automation - Finalize Chat Lifecycle Rehearsals
run-name: Chat Lifecycle Rehearsal Finalizer ${{ inputs.request_id || github.run_id }}

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional exact rehearsal request; empty scans active handoffs
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: chat-lifecycle-rehearsal-finalizer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover handoffs without zero-inventory proof
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_ID: ${{ inputs.request_id || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select bounded latest handoffs
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          scripts/chat-lifecycle/discover-active-handoffs.sh "$REQUEST_ID" matrix.json
          echo "matrix=$(cat matrix.json)" >>"$GITHUB_OUTPUT"

  finalize:
    name: Finalize ${{ matrix.request_id }} before zero-inventory cleanup
    needs: discover
    if: fromJSON(needs.discover.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: cloud-deployment
    env:
      GH_TOKEN: ${{ github.token }}
      WK_CHAT_REQUEST_ID: ${{ matrix.request_id }}
      WK_CHAT_HANDOFF_DIR: /tmp/wukongim-chat-lifecycle/${{ github.run_id }}/${{ matrix.request_id }}/handoff
      WK_CHAT_FINAL_DIR: /tmp/wukongim-chat-lifecycle/${{ github.run_id }}/${{ matrix.request_id }}/final
      WK_CHAT_CLEANUP_DIR: /tmp/wukongim-chat-lifecycle/${{ github.run_id }}/${{ matrix.request_id }}/cleanup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download exact non-secret remote handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chat-lifecycle-rehearsal-handoff-${{ matrix.request_id }}
          path: ${{ env.WK_CHAT_HANDOFF_DIR }}
          run-id: ${{ matrix.handoff_run_id }}
          github-token: ${{ github.token }}
      - name: Authenticate protected-main handoff or cleanup-pending producer
        id: producer
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${{ matrix.handoff_run_id }}" >handoff-run.json
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .repository.full_name == $repository and .head_repository.full_name == $repository and
            .event == "workflow_dispatch" and .head_branch == "main" and
            .status == "completed" and (.conclusion == "success" or .conclusion == "failure") and
            (.path == ".github/workflows/chat-lifecycle-rehearsal.yml" or
             .path == ".github/workflows/chat-lifecycle-rehearsal.yml@refs/heads/main")
          ' handoff-run.json >/dev/null
          echo "conclusion=$(jq -er .conclusion handoff-run.json)" >>"$GITHUB_OUTPUT"
      - name: Classify authenticated handoff content
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$WK_CHAT_HANDOFF_DIR/handoff.json" ]]; then
            for name in deployment-plan.json run-start.json release-selector.json run-plan.json quote.json receipt.json deployment-outcome.json; do
              [[ -f "$WK_CHAT_HANDOFF_DIR/$name" ]]
            done
            echo 'mode=run' >>"$GITHUB_OUTPUT"
          elif [[ -f "$WK_CHAT_HANDOFF_DIR/cleanup-pending.json" && -f "$WK_CHAT_HANDOFF_DIR/release-selector.json" ]]; then
            jq -e --arg request_id "$WK_CHAT_REQUEST_ID" '
              .schema == "wukongim.chat_lifecycle.cleanup_pending/v1" and
              .request_id == $request_id and (.observed_at | type == "string")
            ' "$WK_CHAT_HANDOFF_DIR/cleanup-pending.json" >/dev/null
            jq -e --arg request_id "$WK_CHAT_REQUEST_ID" --arg repository "$GITHUB_REPOSITORY" '
              .schema == "wukongim.cloud_lease.selector/v1" and
              .selector.request_id == $request_id and .selector.repository == $repository
            ' "$WK_CHAT_HANDOFF_DIR/release-selector.json" >/dev/null
            echo 'mode=cleanup_pending' >>"$GITHUB_OUTPUT"
          else
            echo 'authenticated producer Artifact has neither a complete run handoff nor cleanup-pending evidence' >&2
            exit 1
          fi
      - name: Download previously uploaded terminal evidence
        id: previous_download
        if: steps.handoff.outputs.mode == 'run' && matrix.final_exists == true
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chat-lifecycle-rehearsal-final-${{ matrix.request_id }}
          path: ${{ runner.temp }}/previous-final
          run-id: ${{ matrix.final_run_id }}
          github-token: ${{ github.token }}
      - name: Authenticate reusable terminal evidence
        id: previous
        if: steps.handoff.outputs.mode == 'run' && matrix.final_exists == true
        shell: bash
        run: |
          set -euo pipefail
          usable=false
          if [[ "${{ steps.previous_download.outcome }}" == success ]] && \
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${{ matrix.final_run_id }}" >final-run.json && \
            jq -e --arg repository "$GITHUB_REPOSITORY" '
              .repository.full_name == $repository and .head_repository.full_name == $repository and
              (.event == "schedule" or .event == "workflow_dispatch") and .head_branch == "main" and
              .status == "completed" and
              (.path == ".github/workflows/chat-lifecycle-rehearsal-finalize.yml" or
               .path == ".github/workflows/chat-lifecycle-rehearsal-finalize.yml@refs/heads/main")
            ' final-run.json >/dev/null && \
            jq -e --arg request_id "$WK_CHAT_REQUEST_ID" '
              .schema == "wukongim.chat_lifecycle.rehearsal_finalization/v1" and
              .request_id == $request_id and (.outcome | type == "string") and
              (.cause | type == "string") and (.observed_at | type == "string")
            ' "$RUNNER_TEMP/previous-final/finalization.json" >/dev/null && \
            cmp -s <(jq -S -c . "$RUNNER_TEMP/previous-final/handoff.json") \
              <(jq -S -c . "$WK_CHAT_HANDOFF_DIR/handoff.json"); then
            usable=true
          fi
          echo "usable=$usable" >>"$GITHUB_OUTPUT"
      - name: Build trusted finalization validator and SSH identity
        if: steps.handoff.outputs.mode == 'run' && (matrix.final_exists == false || steps.previous.outputs.usable != 'true')
        shell: bash
        env:
          DEPLOYMENT_SSH_PRIVATE_KEY: ${{ secrets.CLOUD_DEPLOYMENT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_SSH_PRIVATE_KEY"
          go build -trimpath -o "$RUNNER_TEMP/wkchatlifecycle" ./cmd/wkchatlifecycle
          umask 077
          printf '%s\n' "$DEPLOYMENT_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/deployment-key"
          chmod 0600 "$RUNNER_TEMP/deployment-key"
          ssh-keygen -y -f "$RUNNER_TEMP/deployment-key" >/dev/null
      - name: Collect terminal report or bounded failure evidence
        id: collect
        if: steps.handoff.outputs.mode == 'run' && (matrix.final_exists == false || steps.previous.outputs.usable != 'true')
        shell: bash
        env:
          WK_CHAT_DEPLOYMENT_KEY: ${{ runner.temp }}/deployment-key
          WK_CHAT_TOOL: ${{ runner.temp }}/wkchatlifecycle
        run: |
          set -euo pipefail
          scripts/chat-lifecycle/rehearsal-finalize.sh | tee "$RUNNER_TEMP/finalize-status.txt"
          if [[ -s "$WK_CHAT_FINAL_DIR/finalization.json" ]]; then
            echo 'ready=true' >>"$GITHUB_OUTPUT"
          else
            echo 'ready=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Reuse previously uploaded final evidence
        id: existing
        if: steps.handoff.outputs.mode == 'run' && matrix.final_exists == true && steps.previous.outputs.usable == 'true'
        shell: bash
        run: echo 'ready=true' >>"$GITHUB_OUTPUT"
      - name: Upload terminal report before any Release
        if: steps.collect.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-lifecycle-rehearsal-final-${{ matrix.request_id }}
          path: ${{ env.WK_CHAT_FINAL_DIR }}
          if-no-files-found: error
          retention-days: 90
      - name: Release exact Lease until zero inventory
        if: steps.handoff.outputs.mode == 'cleanup_pending' || steps.collect.outputs.ready == 'true' || steps.existing.outputs.ready == 'true'
        shell: bash
        env:
          WK_CHAT_SELECTOR: ${{ env.WK_CHAT_HANDOFF_DIR }}/release-selector.json
        run: scripts/chat-lifecycle/release-until-zero.sh
      - name: Seal fresh-formal transition after rehearsal evidence and zero inventory
        id: transition
        if: success() && steps.handoff.outputs.mode == 'run' && (steps.collect.outputs.ready == 'true' || steps.existing.outputs.ready == 'true')
        shell: bash
        env:
          WK_CHAT_TRANSITION_DIR: ${{ runner.temp }}/formal-transition
        run: |
          set -euo pipefail
          final_dir="$WK_CHAT_FINAL_DIR"
          if [[ "${{ steps.existing.outputs.ready }}" == true ]]; then
            final_dir="$RUNNER_TEMP/previous-final"
          fi
          outcome="$(jq -er .outcome "$final_dir/rehearsal-result.json")"
          if [[ "$outcome" != rehearsal_pass ]]; then
            echo 'ready=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          for name in handoff.json run-plan.json quote.json rehearsal-result.json finalization.json; do
            test -f "$final_dir/$name"
          done
          for name in cleanup.json zero-inventory.json; do
            test -f "$WK_CHAT_CLEANUP_DIR/$name"
          done
          cmp -s <(jq -S -c . "$final_dir/handoff.json") <(jq -S -c . "$WK_CHAT_HANDOFF_DIR/handoff.json")
          cmp -s <(jq -S -c .selector "$WK_CHAT_HANDOFF_DIR/release-selector.json") \
            <(jq -S -c .result.zero_inventory.selector "$WK_CHAT_CLEANUP_DIR/zero-inventory.json")
          request_id="$(jq -er .request_id "$final_dir/handoff.json")"
          source_sha="$(jq -er .source_sha "$final_dir/handoff.json")"
          bundle_digest="$(jq -er .bundle_digest "$final_dir/handoff.json")"
          prior="$(jq -er .lease_plan.budget.committed_micros "$final_dir/run-plan.json")"
          rehearsal_quote="$(jq -er .quote.estimated_cost_micros "$final_dir/quote.json")"
          committed_micros=$(( prior + rehearsal_quote ))
          (( committed_micros > 0 && committed_micros < 1350000000 ))
          install -d -m 0700 "$WK_CHAT_TRANSITION_DIR"
          jq -n --arg schema 'wukongim.chat_lifecycle.formal_transition/v1' \
            --arg from_stage rehearsal --arg outcome rehearsal_pass \
            --arg request_id "$request_id" --arg source_sha "$source_sha" \
            --arg bundle_digest "$bundle_digest" --argjson committed_micros "$committed_micros" \
            '{schema:$schema,from_stage:$from_stage,outcome:$outcome,request_id:$request_id,
              source_sha:$source_sha,bundle_digest:$bundle_digest,committed_micros:$committed_micros,
              zero_inventory:true}' >"$WK_CHAT_TRANSITION_DIR/transition.json"
          cp "$final_dir/handoff.json" "$final_dir/run-plan.json" "$final_dir/quote.json" \
            "$final_dir/rehearsal-result.json" "$final_dir/finalization.json" "$WK_CHAT_TRANSITION_DIR/"
          cp "$WK_CHAT_HANDOFF_DIR/release-selector.json" "$WK_CHAT_TRANSITION_DIR/"
          cp "$WK_CHAT_CLEANUP_DIR/cleanup.json" "$WK_CHAT_CLEANUP_DIR/zero-inventory.json" \
            "$WK_CHAT_TRANSITION_DIR/"
          echo 'ready=true' >>"$GITHUB_OUTPUT"
      - name: Upload fresh-formal transition for the scheduled starter
        if: steps.transition.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-lifecycle-formal-transition-${{ matrix.request_id }}
          path: ${{ runner.temp }}/formal-transition
          if-no-files-found: error
          retention-days: 8
      - name: Upload zero-inventory proof
        if: success() && (steps.handoff.outputs.mode == 'cleanup_pending' || steps.collect.outputs.ready == 'true' || steps.existing.outputs.ready == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-lifecycle-rehearsal-cleanup-${{ matrix.request_id }}
          path: ${{ env.WK_CHAT_CLEANUP_DIR }}
          if-no-files-found: error
          retention-days: 90
      - name: Remove plaintext runner identity
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deployment-key"

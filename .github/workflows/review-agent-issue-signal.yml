name: Safety Automation - Review Agent Issue Signal
run-name: Review Agent linked Issue #${{ github.event.issue.number }} changed

on:
  issues:
    types: [edited, closed, reopened]

permissions: {}

concurrency:
  group: review-agent-issue-signal-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  signal:
    name: Wake PRs linked to the changed Issue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Resolve bounded reverse links and dispatch Controller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          pages="$RUNNER_TEMP/open-pull-requests.jsonl"
          : >"$pages"
          complete=false
          for page in {1..10}; do
            payload="$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100&page=${page}")"
            count="$(jq -er 'length' <<<"$payload")"
            [[ "$count" =~ ^[0-9]{1,3}$ ]] && (( count <= 100 ))
            jq -c '.[] | {number,body}' <<<"$payload" >>"$pages"
            if (( count < 100 )); then
              complete=true
              break
            fi
          done
          if [[ "$complete" != true ]]; then
            echo "open pull-request reverse-link scan exceeds 1000 items" >&2
            exit 1
          fi
          pattern="(?i)(^|[^A-Za-z0-9])(close(s|d)?|fix(es|ed)?|resolve(s|d)?)[[:space:]]+#${ISSUE_NUMBER}([^0-9]|$)"
          jq -sr --arg pattern "$pattern" \
            '[.[] | select((.body // "") | test($pattern)) | .number] |
             unique | .[]' "$pages" >"$RUNNER_TEMP/linked-pull-requests.txt"
          while IFS= read -r pull_request; do
            [[ "$pull_request" =~ ^[1-9][0-9]{0,9}$ ]]
            gh workflow run review-agent.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f "pull_request=$pull_request"
          done <"$RUNNER_TEMP/linked-pull-requests.txt"

name: Safety Automation - Propose Web EasySDK Documentation Upgrade

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      verify_current:
        description: Verify the currently documented package without creating a PR
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/easy-sdk-web-docs-sync.yml
      - docs-site/scripts/easy-sdk-sync/**
      - docs-site/lib/easy-sdk-releases.json
      - docs-site/content/docs/sdk/easy/javascript/**
      - test/e2e/message/easy_sdk_docs_release/**

permissions:
  contents: read

concurrency:
  group: easy-sdk-web-docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.selection.outputs.decision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.3.0'
      - name: Resolve a published npm artifact and its successful tag publication
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_CURRENT: ${{ github.event_name == 'pull_request' || inputs.verify_current == true }}
        run: node docs-site/scripts/easy-sdk-sync/cli.mjs discover "$RUNNER_TEMP/easy-sdk-plan"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.selection.outputs.decision != 'unchanged'
        with:
          name: easy-sdk-discovery
          path: ${{ runner.temp }}/easy-sdk-plan/plan.json
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: discover
    if: needs.discover.outputs.decision != 'unchanged'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easy-sdk-discovery
          path: ${{ runner.temp }}/easy-sdk-plan
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.3.0'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Install the locked browser tools without lifecycle scripts
        working-directory: test/e2e/message/easy_sdk_docs_release
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Probe and enable the exact Chromium sandbox executable
        run: bash test/e2e/message/easy_sdk_docs_release/prepare-sandbox.sh
      - name: Compile the literal bilingual tutorial against the exact npm artifact
        run: node test/e2e/message/easy_sdk_docs_release/prepare.mjs "$RUNNER_TEMP/easy-sdk-plan"
      - name: Verify browser messaging and cleanup on a real single-node cluster
        env:
          GOWORK: 'off'
          WK_E2E_EASYSDK_ARTIFACTS: ${{ runner.temp }}/easy-sdk-plan
        run: go test -tags=e2e ./test/e2e/message/easy_sdk_docs_release -count=1 -timeout=5m -p=1 -v
      - name: Materialize the bounded documentation proposal
        run: node docs-site/scripts/easy-sdk-sync/cli.mjs apply "$RUNNER_TEMP/easy-sdk-plan"
      - name: Verify all documentation outputs
        working-directory: docs-site
        run: |
          bun install --frozen-lockfile
          bun run verify
      - name: Seal the accepted document hashes
        run: node docs-site/scripts/easy-sdk-sync/cli.mjs seal "$RUNNER_TEMP/easy-sdk-plan"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easy-sdk-acceptance
          path: |
            ${{ runner.temp }}/easy-sdk-plan/plan.json
            ${{ runner.temp }}/easy-sdk-plan/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove the temporary Chromium AppArmor profile
        if: always()
        run: |
          if [[ -n "${EASY_SDK_CHROMIUM_PROFILE:-}" && -f "$EASY_SDK_CHROMIUM_PROFILE" ]]; then
            sudo apparmor_parser -R "$EASY_SDK_CHROMIUM_PROFILE"
            rm "$EASY_SDK_CHROMIUM_PROFILE"
          fi

  propose:
    needs: [discover, verify]
    if: >-
      needs.discover.outputs.decision == 'upgrade' &&
      github.repository == 'WuKongIM/WuKongIM' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.3.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easy-sdk-acceptance
          path: ${{ runner.temp }}/easy-sdk-plan
      - name: Recreate the three allowed files from trusted source
        run: node docs-site/scripts/easy-sdk-sync/cli.mjs apply "$RUNNER_TEMP/easy-sdk-plan"
      - name: Create or recover the version-specific PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node docs-site/scripts/easy-sdk-sync/cli.mjs publish "$RUNNER_TEMP/easy-sdk-plan"

name: CI
# The single correctness pipeline for pull requests and main.
#
# Every pull request runs `lint`; the other jobs run only when their area
# changed (scripts/ci/changes.sh). `ci-ok` aggregates every job and is the only
# check branch protection needs to require: a skipped job counts as passing,
# a failed or cancelled job fails it.
#
# Performance is not gated here. See perf.yml (nightly, `perf` label, manual).
run-name: CI ${{ github.event_name }} ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full coverage: race on every listed package, all integration
    # tests, every E2E suite and every gofail fault-injection E2E suite. Not
    # part of the pull-request gate.
    - cron: "37 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      web: ${{ steps.classify.outputs.web }}
      demo: ${{ steps.classify.outputs.demo }}
      docs: ${{ steps.classify.outputs.docs }}
      docs_golden: ${{ steps.classify.outputs.docs_golden }}
      packaging: ${{ steps.classify.outputs.packaging }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          # Pull requests diff against their base; scheduled and manual runs
          # have no base and select every area.
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || '' }}
        run: scripts/ci/changes.sh "$BASE_SHA" HEAD | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: go run ./cmd/wkcicheck go-format
      - name: go vet
        run: go run ./cmd/wkcicheck go-vet
      - name: go mod tidy
        run: go run ./cmd/wkcicheck go-mod-tidy
      - name: FLOW documents
        run: go run ./cmd/wkcicheck flow-doc-contracts
      - name: Agent skills
        run: |
          go run ./cmd/wkcicheck agent-artifact-contracts
          go run ./cmd/wkcicheck skill-focused-contracts
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9 -shellcheck=
      - name: zizmor (Actions security audit)
        # Older cloud workflows are audited when they are rebuilt.
        run: pipx run zizmor==1.16.3 --offline --min-severity medium .github/workflows/ci.yml .github/workflows/perf.yml .github/workflows/compat.yml .github/workflows/binary-release-publish.yml
      - name: Reject tracked-tree mutation
        if: always()
        run: git diff --exit-code HEAD --

  unit:
    name: Go unit
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test ./cmd/... ./internal/... ./pkg/... ./scripts/... ./docker/... -count=1
      - name: Reject tracked-tree mutation
        if: always()
        run: git diff --exit-code HEAD --

  race:
    name: Go race (messaging hot path)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/bench/workload ./internal/bench/worker ./pkg/client ./pkg/gateway/transport/gnet -count=1
      - run: go test -race -tags=integration ./internal/bench/arrival -count=1

  integration:
    name: Scripts integration
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # The scripts package alone runs about nine minutes (serial sum ~15 min
      # at -parallel=2); a 9m binary timeout killed whole runs eight times in
      # October. Keep parallelism at 2: these tests are timing-sensitive.
      - run: go test -tags=integration ./scripts/... -count=1 -timeout=15m -parallel=2
      - name: Reject tracked-tree mutation
        if: always()
        run: git diff --exit-code HEAD --

  e2e:
    name: E2E (migration, messaging, three-node smoke)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build one E2E server binary
        run: go build -tags=e2e -o "$RUNNER_TEMP/wukongim-e2e" ./cmd/wukongim
      # WK_E2E_BINARY is set per step, never job-wide: the server rejects every
      # unknown WK_* variable as configuration.
      - name: Migration (all ordinary-history topologies)
        env:
          WK_E2E_BINARY: ${{ runner.temp }}/wukongim-e2e
        run: go test -tags=e2e ./test/e2e/migration/ordinary_history -count=1 -timeout=12m -p=1 -parallel=1
      - name: Cross-node delivery
        env:
          WK_E2E_BINARY: ${{ runner.temp }}/wukongim-e2e
        run: go test -tags=e2e ./test/e2e/message/cross_node_delivery -count=1 -timeout=2m -p=1
      - name: Self chat
        env:
          WK_E2E_BINARY: ${{ runner.temp }}/wukongim-e2e
        run: go test -tags=e2e ./test/e2e/message/self_chat -count=1 -timeout=4m -p=1
      - name: Three-node 500 SEND/s correctness and drain smoke
        # Runner disk, not tmpfs: the harness preflight requires more free
        # space than /dev/shm offers. The 1000 ms SENDACK budget stays far
        # above slow-disk runners (~164 ms channel-append p99 on EPYC 9V74).
        run: |
          api_token="$(openssl rand -hex 32)"
          worker_token="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$api_token" "$worker_token"
          export WK_BENCH_API_TOKEN="$api_token" WK_BENCH_WORKER_TOKEN="$worker_token"
          run_dir="$(mktemp -d "$RUNNER_TEMP/wk-three-node.XXXXXXXX")"
          echo "THREE_NODE_RUN_DIR=$run_dir" >>"$GITHUB_ENV"
          scripts/run-wukongim-three-node-chat-lifecycle-shakeout.sh \
            --run-dir "$run_dir/artifacts" --base-port 15000 --ready-timeout 120 \
            --send-rate 500 --measure-seconds 90 --warmup-seconds 60 \
            --drain-timeout 90 --hot-sendack-p99-ms 1000
      - name: Keep three-node smoke logs on failure
        if: failure() && env.THREE_NODE_RUN_DIR != ''
        run: |
          mkdir -p "$RUNNER_TEMP/three-node-logs"
          find "$THREE_NODE_RUN_DIR" -type f \( -name '*.log' -o -name '*.json' -o -name '*.md' \) -size -16M \
            -exec cp --parents {} "$RUNNER_TEMP/three-node-logs" \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/three-node-logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Reject tracked-tree mutation
        if: always()
        run: git diff --exit-code HEAD --

  web:
    name: Manager web and browser smoke
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.12.0"
      - name: Lint, test, typecheck and build; embedded bundle must be current
        run: go run ./cmd/wkcicheck web
      - name: Real three-node Chromium smoke (desktop and mobile)
        run: |
          (cd web && bunx playwright install --with-deps chromium)
          WK_E2E_MANAGER_BROWSER=1 go test -tags=e2e ./test/e2e/cluster/manager_browser_smoke -count=1 -timeout 5m -p=1 -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: manager-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  demo:
    name: Chat demo
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.12.0"
      - run: npm install --global yarn@1.22.22
      - name: Test and build; embedded bundle must be current
        run: go run ./cmd/wkcicheck demo

  docs:
    name: Documentation contracts
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.12.0"
      - name: Source contracts, site verification and static export
        run: go run ./cmd/wkcicheck docs
      - name: Golden path against a real single-node cluster
        if: needs.changes.outputs.docs_golden == 'true'
        run: go run ./cmd/wkcicheck docs-integration

  package:
    name: Native package build
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build deb and rpm preview
        uses: goreleaser/goreleaser-action@4c6ab561adb47e50c45ef534e2155934e91c40c1 # v7.2.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean --config .goreleaser.packages.yaml
      - name: Inspect package metadata and install on Ubuntu 24.04
        # The four-distribution systemd lifecycle matrix runs in compat.yml.
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm
          WK_NATIVE_PACKAGE_SKIP_BUILD=1 WK_NATIVE_PACKAGE_REQUIRE_INSPECTORS=1 ./scripts/validate-native-package.sh
          ./scripts/validate-native-package-container.sh ubuntu:24.04 deb
      - name: Reject tracked-tree mutation
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  # ---- Nightly-only full coverage (never part of the pull-request gate) ----

  nightly-full:
    name: Nightly ${{ matrix.suite }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Serial E2E over every suite exceeded one 60-minute job, so it runs
        # as named wkcicheck shards (stable round-robin of sorted packages).
        suite: [integration]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: startsWith(matrix.suite, 'e2e-shard-')
        with:
          node-version: "22.12.0"
      - name: Run ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            race) go test -race ./internal/app ./internal/runtime/... ./pkg/plugin/pluginhost ./pkg/wklog \
                    ./pkg/gateway/... ./pkg/transport/... ./pkg/channel/... ./pkg/cluster/... ./pkg/slot/... -count=1 -p=1 -timeout=50m ;;
            integration) go run ./cmd/wkcicheck integration ;;
            e2e-shard-*|gofail-e2e) go run ./cmd/wkcicheck "$SUITE" ;;
          esac
      - name: Upload gofail E2E evidence
        if: always() && matrix.suite == 'gofail-e2e'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gofail-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-output/gofail-e2e
            !.ci-output/gofail-e2e/wukongim-gofail
          if-no-files-found: ignore
          retention-days: 14

  nightly-report:
    name: Track nightly failures
    needs: [nightly-full]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/report-nightly-failure.sh "Nightly CI"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, unit, race, integration, e2e, web, demo, docs, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null

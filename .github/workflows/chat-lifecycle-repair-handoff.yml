name: Agent Tool - Publish Chat Lifecycle Repair Handoff
run-name: Chat Lifecycle Repair Handoff ${{ inputs.request_id }} ${{ inputs.parent_run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Exact repair request identity
        required: true
        type: string
      parent_run_id:
        description: Exact active repair workflow run
        required: true
        type: string
      artifact_kind:
        description: Durable Lease handoff or one terminal generation checkpoint
        required: true
        default: handoff
        type: choice
        options: [handoff, checkpoint]
      generation:
        description: Zero for handoff; one-based candidate generation for checkpoint
        required: true
        default: "0"
        type: string
      receipt_json:
        description: Exact active repair Lease Receipt
        required: true
        type: string
      selector_json:
        description: Exact selector for bounded recovery cleanup
        required: true
        type: string
      decision_json:
        description: Strict bounded terminal decision; checkpoint only
        required: false
        default: ""
        type: string
      diagnosis_json:
        description: Strict bounded terminal diagnosis; checkpoint only
        required: false
        default: ""
        type: string
      terminal_cut_json:
        description: Bounded three-worker terminal status and snapshot cut; checkpoint only
        required: false
        default: ""
        type: string
      publish_authorization:
        description: Exact non-billable handoff publication authority
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: chat-lifecycle-repair-handoff-${{ github.repository }}-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_ID: ${{ inputs.request_id }}
      PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      ARTIFACT_KIND: ${{ inputs.artifact_kind }}
      GENERATION: ${{ inputs.generation }}
      RECEIPT_JSON: ${{ inputs.receipt_json }}
      SELECTOR_JSON: ${{ inputs.selector_json }}
      DECISION_JSON: ${{ inputs.decision_json }}
      DIAGNOSIS_JSON: ${{ inputs.diagnosis_json }}
      TERMINAL_CUT_JSON: ${{ inputs.terminal_cut_json }}
      PUBLISH_AUTHORIZATION: ${{ inputs.publish_authorization }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Authenticate exact active repair parent and Lease
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]]
          [[ "$PARENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GENERATION" =~ ^[0-9]+$ ]]
          [[ "$PUBLISH_AUTHORIZATION" == publish-chat-lifecycle-repair-handoff ]]
          (( ${#RECEIPT_JSON} <= 1048576 && ${#SELECTOR_JSON} <= 16384 ))
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}" >parent-run.json
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg request "$REQUEST_ID" '
            .repository.full_name == $repository and .head_repository.full_name == $repository and
            .head_branch == "main" and .event == "workflow_dispatch" and .status == "in_progress" and
            .display_title == ("Chat Lifecycle Repair " + $request) and
            (.path == ".github/workflows/chat-lifecycle-repair.yml" or
             .path == ".github/workflows/chat-lifecycle-repair.yml@refs/heads/main")
          ' parent-run.json >/dev/null
          umask 077
          printf '%s\n' "$RECEIPT_JSON" >receipt.json
          printf '%s\n' "$SELECTOR_JSON" >release-selector.json
          go build -trimpath -o "$RUNNER_TEMP/wkchatlifecycle" ./cmd/wkchatlifecycle
          "$RUNNER_TEMP/wkchatlifecycle" selector --receipt receipt.json >derived-selector.json
          cmp -s <(jq -S -c . derived-selector.json) <(jq -S -c . release-selector.json)
          jq -e --arg request "$REQUEST_ID" --arg repository "$GITHUB_REPOSITORY" '
            .schema == "wukongim.cloud_lease.receipt/v1" and .receipt.request_id == $request and
            .receipt.repository == $repository and .receipt.state == "active" and
            .receipt.provider == "alibaba" and .receipt.region == "cn-hangzhou" and
            .receipt.tags.stage == "repair" and (.receipt.lease_id | length > 0) and
            (.receipt.provenance.source_sha | test("^[0-9a-f]{40}$")) and
            (.receipt.provenance.bundle_digest | test("^sha256:[0-9a-f]{64}$")) and
            (.receipt.expires_at | fromdateiso8601 > now)
          ' receipt.json >/dev/null
          case "$ARTIFACT_KIND" in
            handoff)
              [[ "$GENERATION" == 0 && -z "$DECISION_JSON" && -z "$DIAGNOSIS_JSON" && -z "$TERMINAL_CUT_JSON" ]]
              jq -n --arg schema 'wukongim.chat_lifecycle.repair_handoff/v1' \
                --arg request_id "$REQUEST_ID" --argjson parent_run_id "$PARENT_RUN_ID" \
                --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --slurpfile receipt receipt.json --slurpfile selector release-selector.json '
                {schema:$schema,request_id:$request_id,parent_run_id:$parent_run_id,
                 lease_id:$receipt[0].receipt.lease_id,source_sha:$receipt[0].receipt.provenance.source_sha,
                 bundle_digest:$receipt[0].receipt.provenance.bundle_digest,expires_at:$receipt[0].receipt.expires_at,
                 plan_digest:$receipt[0].receipt.plan_digest,published_at:$published_at,
                 selector:$selector[0].selector}
              ' >repair-handoff.json
              ;;
            checkpoint)
              (( GENERATION > 0 && ${#DECISION_JSON} <= 8192 && ${#DIAGNOSIS_JSON} <= 4096 &&
                 ${#TERMINAL_CUT_JSON} > 0 && ${#TERMINAL_CUT_JSON} <= 45000 ))
              printf '%s\n' "$DECISION_JSON" >repair-decision.json
              printf '%s\n' "$DIAGNOSIS_JSON" >repair-diagnosis.json
              printf '%s\n' "$TERMINAL_CUT_JSON" >repair-terminal-cut.json
              jq -e --arg request "$REQUEST_ID" --arg lease "$(jq -er .receipt.lease_id receipt.json)" \
                --argjson generation "$GENERATION" '
                .schema == "wukongim.chat_lifecycle.repair_step/v1" and
                .decision.action == "stop_and_diagnose" and .decision.generation == $generation and
                .state.candidate.request_id == $request and .state.candidate.lease_id == $lease and
                .state.candidate.generation == $generation and
                (.state.candidate.source_sha | test("^[0-9a-f]{40}$")) and
                (.state.candidate.bundle_digest | test("^sha256:[0-9a-f]{64}$"))
              ' repair-decision.json >/dev/null
              jq -e --arg reason "$(jq -er .decision.reason repair-decision.json)" '
                .schema == "wukongim.chat_lifecycle.repair_diagnosis/v1" and
                .reason == $reason and (.observed_at | type == "string") and
                (.journal_sha256 == "" or (.journal_sha256 | test("^[0-9a-f]{64}$")))
              ' repair-diagnosis.json >/dev/null
              jq -e --argjson generation "$GENERATION" '
                .schema == "wukongim.chat_lifecycle.repair_terminal_cut/v1" and
                .generation == $generation and (.workers | length == 3) and
                [.workers[].worker] == [1,2,3]
              ' repair-terminal-cut.json >/dev/null
              install -d -m 0700 terminal-cut
              for worker in 1 2 3; do
                jq -ec --argjson worker "$worker" '.workers[] | select(.worker == $worker) | .status' \
                  repair-terminal-cut.json >"terminal-cut/status-${worker}.json"
                jq -ec --argjson worker "$worker" '.workers[] | select(.worker == $worker) | .snapshot' \
                  repair-terminal-cut.json >"terminal-cut/snapshot-${worker}.json"
              done
              jq -c .state repair-decision.json >repair-state.json
              capture_args=(repair-capture --state repair-state.json \
                --observed-at "$(jq -er .decision.observed_at repair-decision.json)")
              for worker in 1 2 3; do
                capture_args+=(--worker-status "terminal-cut/status-${worker}.json" \
                  --worker-snapshot "terminal-cut/snapshot-${worker}.json")
              done
              "$RUNNER_TEMP/wkchatlifecycle" "${capture_args[@]}" >reconstructed-observation.json
              jq -e --slurpfile observation reconstructed-observation.json '
                .decision.observed_at == $observation[0].observed_at and
                .state.candidate.request_id == $observation[0].request_id and
                .state.candidate.lease_id == $observation[0].lease_id and
                .state.candidate.generation == $observation[0].generation and
                .state.last_online == $observation[0].online and
                .state.last_sent == $observation[0].sent and
                .state.last_send_acknowledged == $observation[0].send_acknowledged and
                .state.last_terminal_errors == $observation[0].terminal_errors
              ' repair-decision.json >/dev/null
              candidate_sha="$(jq -er .state.candidate.source_sha repair-decision.json)"
              git fetch --no-tags origin main
              git merge-base --is-ancestor "$candidate_sha" origin/main
              jq -n --arg schema 'wukongim.chat_lifecycle.repair_checkpoint/v1' \
                --arg request_id "$REQUEST_ID" --argjson parent_run_id "$PARENT_RUN_ID" \
                --argjson generation "$GENERATION" --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --slurpfile decision repair-decision.json --slurpfile diagnosis repair-diagnosis.json \
                '{schema:$schema,request_id:$request_id,parent_run_id:$parent_run_id,generation:$generation,
                  published_at:$published_at,decision:$decision[0].decision,diagnosis:$diagnosis[0]}' \
                >repair-checkpoint.json
              ;;
            *) exit 2 ;;
          esac
      - name: Upload durable selector-bound repair artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_kind == 'handoff' && format('chat-lifecycle-repair-handoff-{0}', inputs.request_id) || format('chat-lifecycle-repair-checkpoint-{0}-{1}', inputs.request_id, inputs.generation) }}
          path: |
            repair-handoff.json
            repair-checkpoint.json
            repair-decision.json
            repair-diagnosis.json
            repair-terminal-cut.json
            terminal-cut
            receipt.json
            release-selector.json
          if-no-files-found: error
          retention-days: 7

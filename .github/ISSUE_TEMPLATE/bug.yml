name: Bug report
description: Report a reproducible WuKongIM behavior problem
title: "[BUG] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve WuKongIM. Please do not include credentials,
        access tokens, private messages, or other private data.

  - type: input
    id: affected_version
    attributes:
      label: Affected version
      description: Optional. Use an exact release tag, full commit SHA, or image digest—not "latest"; leave blank to use the main commit at maintainer authorization time.
      placeholder: v2.1.0
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment, topology, and client
      description: Briefly include deployment method, operating system, and client/SDK version. Topology is optional and defaults to a single-node cluster.
      placeholder: Docker; three-node cluster; Linux; Go SDK v1.2.3
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the shortest sequence that consistently demonstrates the problem.
      placeholder: |
        1. Start...
        2. Connect...
        3. Send...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual result
      description: State what you expected and what happened instead.
      placeholder: Expected...; actually observed...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Intermittent
        - Happened once
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or configuration
      description: Optional. Redact credentials, tokens, private messages, and other private data.
      render: shell
    validations:
      required: false
